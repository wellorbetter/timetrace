[workspace]
members = [
    "crates/core",
    "crates/tui",
    "crates/gui",
    "bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging", "Win32_System_Threading",
    "Win32_System_ProcessStatus", "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com",
    "Win32_System_TaskScheduler", "Win32_Foundation", "Win32_System_Time",
    "Win32_System_SystemInformation",
] }
sysinfo = "0.33"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dirs = "6"
clap = { version = "4", features = ["derive"] }
seahash = "4"
once_cell = "1"
ratatui = "0.30"
crossterm = "0.29"
eframe = "0.31"
egui = "0.31"
egui_plot = "0.31"
egui_extras = { version = "0.31", features = ["datepicker"] }
tray-icon = "0.19"
winreg = "0.54"

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"
codegen-units = 1
panic = "abort"
