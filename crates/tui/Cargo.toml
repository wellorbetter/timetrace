[package]
name = "timetrace-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TimeTrace TUI — terminal dashboard"

[[bin]]
name = "tt"
path = "src/main.rs"

[dependencies]
timetrace-core = { path = "../core" }

# ── TUI ──
ratatui = "0.30"
crossterm = "0.29"

# ── CLI ──
clap = { version = "4", features = ["derive"] }

# ── Foundation ──
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
seahash = "4"

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"
codegen-units = 1
panic = "abort"
