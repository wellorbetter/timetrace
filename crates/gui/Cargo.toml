[package]
name = "timetrace-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TimeTrace GUI — legacy Windows native desktop window"

[features]
# The egui frontend predates the Flutter desktop app and still depends on
# Win32-only icon/startup integrations. Keep it opt-in so cross-platform
# workspace tests validate shared Rust code instead of compiling a Windows
# compatibility frontend on Linux/macOS.
legacy-windows-gui = []

[[bin]]
name = "tt-gui"
path = "src/main.rs"
required-features = ["legacy-windows-gui"]

[dependencies]
timetrace-core = { path = "../core" }
eframe.workspace = true
egui.workspace = true
clap.workspace = true
chrono.workspace = true
dirs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
seahash.workspace = true
once_cell.workspace = true
egui_extras.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
