[package]
name = "timetrace-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared core for TimeTrace: contracts, engine, storage"

[dependencies]
amadeus-core = { path = "../amadeus-core" }
sysinfo.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
thiserror.workspace = true
dirs.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
winreg.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSURL"] }
