name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --workspace

  flutter-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd app && flutter pub get
      - run: cd app && flutter analyze --no-fatal-infos
      - run: cd app && flutter test
      - run: cd app && flutter build windows --release

  macos-app:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Rust core and bridge tests
        run: cargo test -p timetrace-core -p timetrace-bridge
      - name: Validate self-use installer
        run: bash -n scripts/install_macos.command
      - name: Build signed macOS bundle
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh
      - name: Smoke launch macOS app
        run: |
          set -euo pipefail
          APP_PATH="$(find app/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          APP_BIN="$APP_PATH/Contents/MacOS/$EXECUTABLE"
          test -x "$APP_BIN"
          "$APP_BIN" >"$RUNNER_TEMP/timetrace-smoke.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "TimeTrace exited during smoke launch" >&2
            cat "$RUNNER_TEMP/timetrace-smoke.log" >&2 || true
            exit 1
          fi

          DATA_DIR="$HOME/Library/Application Support/TimeTrace"
          APP_LOG="$DATA_DIR/app.log"
          DB_PATH="$DATA_DIR/time.db"
          test -s "$DB_PATH"
          test -f "$APP_LOG"
          grep -q 'TimeTraceApi initialized' "$APP_LOG"
          grep -q 'tray initialized (macos)' "$APP_LOG"
          if grep -q 'API init FAILED' "$APP_LOG"; then
            echo "Rust API initialization failed during smoke launch" >&2
            cat "$APP_LOG" >&2
            exit 1
          fi

          kill "$PID" || true
          wait "$PID" || true
          trap - EXIT
      - name: Package macOS self-use installer
        run: |
          APP_PATH="$(find app/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          PACKAGE_DIR="$RUNNER_TEMP/TimeTrace-macOS"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          ditto "$APP_PATH" "$PACKAGE_DIR/TimeTrace.app"
          cp scripts/install_macos.command "$PACKAGE_DIR/Install TimeTrace.command"
          chmod +x "$PACKAGE_DIR/Install TimeTrace.command"
          printf '%s\n' \
            'TimeTrace macOS self-use preview' \
            '' \
            '1. Try double-clicking “Install TimeTrace.command”.' \
            '2. If macOS blocks the installer itself, right-click it and choose Open once.' \
            '3. The installer copies TimeTrace to /Applications (or ~/Applications when needed),' \
            "   removes only TimeTrace.app's quarantine attribute, verifies the bundle signature," \
            '   creates the Application Support directory, and launches the app.' \
            '' \
            'This preview does NOT disable Gatekeeper globally.' \
            'A public no-warning distribution still requires Apple Developer ID notarization.' \
            > "$PACKAGE_DIR/README.txt"
          ditto -c -k --sequesterRsrc --keepParent "$PACKAGE_DIR" "$RUNNER_TEMP/TimeTrace-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TimeTrace-macOS
          path: ${{ runner.temp }}/TimeTrace-macOS.zip
          if-no-files-found: error
