name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p timetrace-core --lib

  flutter-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cd app && flutter analyze --no-fatal-infos
      - run: cd app && flutter build windows --release
