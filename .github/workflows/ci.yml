name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --workspace

  flutter-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cd app && flutter pub get
      - run: cd app && flutter analyze --no-fatal-infos
      - run: cd app && flutter test
      - run: cd app && flutter build windows --release

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Rust core and bridge tests
        run: cargo test -p timetrace-core -p timetrace-bridge
      - name: Build signed macOS bundle
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh
      - name: Smoke launch macOS app
        run: |
          APP_PATH="$(find app/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          APP_BIN="$APP_PATH/Contents/MacOS/$EXECUTABLE"
          test -x "$APP_BIN"
          "$APP_BIN" >"$RUNNER_TEMP/timetrace-smoke.log" 2>&1 &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "TimeTrace exited during smoke launch" >&2
            cat "$RUNNER_TEMP/timetrace-smoke.log" >&2 || true
            exit 1
          fi
          kill "$PID" || true
          wait "$PID" || true
      - name: Package macOS app
        run: |
          APP_PATH="$(find app/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/TimeTrace-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TimeTrace-macOS
          path: ${{ runner.temp }}/TimeTrace-macOS.zip
          if-no-files-found: error
