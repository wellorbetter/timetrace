name: macOS Demo Recording

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/ai-recap
    paths:
      - '.github/workflows/macos_demo_recording.yml'
      - 'app/lib/src/app.dart'
      - 'app/lib/src/core/acceptance/**'
      - 'scripts/seed_acceptance_demo.py'

concurrency:
  group: demo-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  record-macos-demo:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build signed macOS release app
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      - name: Install FFmpeg when missing
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ffmpeg -version | head -n1

      - name: Seed disposable demo data
        run: |
          DEMO_DB="$HOME/Library/Application Support/TimeTrace/time.db"
          python3 scripts/seed_acceptance_demo.py --db "$DEMO_DB"
          test -s "$DEMO_DB"

      - name: Record deterministic Flutter render-tree demo
        run: |
          set -euo pipefail
          APP_PATH="$(find app/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          APP_BIN="$APP_PATH/Contents/MacOS/$EXECUTABLE"

          FRAME_DIR="$RUNNER_TEMP/timetrace-macos-frames"
          VIDEO="$RUNNER_TEMP/timetrace-macos-demo.mp4"
          mkdir -p "$FRAME_DIR"

          TIMETRACE_ACCEPTANCE_CAPTURE_DIR="$FRAME_DIR" \
            "$APP_BIN" >"$RUNNER_TEMP/timetrace-macos-demo.log" 2>&1 &
          APP_PID=$!

          for _ in $(seq 1 80); do
            if [[ -f "$FRAME_DIR/capture.done" ]]; then
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/timetrace-macos-demo.log" >&2
              exit 1
            fi
            sleep 1
          done

          test -f "$FRAME_DIR/capture.done"
          test -f "$FRAME_DIR/capture.json"
          FRAME_COUNT="$(find "$FRAME_DIR" -name 'frame-*.png' | wc -l | tr -d ' ')"
          test "$FRAME_COUNT" -ge 180

          ffmpeg -y -loglevel warning \
            -framerate 10 -i "$FRAME_DIR/frame-%05d.png" \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2" \
            -c:v libx264 -crf 20 -preset medium -pix_fmt yuv420p \
            -movflags +faststart "$VIDEO"

          kill "$APP_PID" || true
          wait "$APP_PID" || true

          test -s "$VIDEO"
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -show_entries format=duration,size -of default=nw=1 "$VIDEO"
          cp "$FRAME_DIR/capture.json" "$RUNNER_TEMP/macos-render-capture.json"

      - name: Pre-approve replayd capture reminder
        run: |
          set -euo pipefail
          APPROVALS="$HOME/Library/Group Containers/group.com.apple.replayd/ScreenCaptureApprovals.plist"
          mkdir -p "$(dirname "$APPROVALS")"

          # GitHub runner-images uses replayd approvals to prevent the private
          # window picker reminder from stealing focus during UI automation.
          for ACTOR in \
            /opt/hca/hosted-compute-agent \
            /bin/bash \
            "$(command -v bash)" \
            /usr/sbin/screencapture \
            "$(command -v ffmpeg)"; do
            [[ -n "$ACTOR" ]] || continue
            defaults write "$APPROVALS" "$ACTOR" -date "3024-01-01 00:00:00 +0000"
          done
          killall cfprefsd 2>/dev/null || true
          plutil -p "$APPROVALS" | tee "$RUNNER_TEMP/replayd-screen-capture-approvals.txt"

      - name: Record clean native macOS demo
        run: |
          set -euo pipefail
          APP_PATH="$(find app/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          APP_BIN="$APP_PATH/Contents/MacOS/$EXECUTABLE"
          RAW_VIDEO="$RUNNER_TEMP/timetrace-macos-native.mov"
          VIDEO="$RUNNER_TEMP/timetrace-macos-native.mp4"

          "$APP_BIN" >"$RUNNER_TEMP/timetrace-macos-native.log" 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          sleep 7
          osascript -e 'tell application "TimeTrace" to activate'

          /usr/sbin/screencapture -v -V 22 -k "$RAW_VIDEO" \
            >"$RUNNER_TEMP/screencapture-macos-native.log" 2>&1 &
          CAPTURE_PID=$!

          # Drive the real application while the native screen recorder runs.
          sleep 2
          osascript -e 'tell application "System Events" to keystroke "2" using command down'
          sleep 4
          osascript -e 'tell application "System Events" to keystroke "," using command down'
          sleep 4
          osascript -e 'tell application "System Events" to keystroke "1" using command down'
          sleep 4
          osascript -e 'tell application "System Events" to keystroke "2" using command down'

          wait "$CAPTURE_PID"
          test -s "$RAW_VIDEO"

          # screencapture on recent hosted macOS images can emit an occasional
          # packet with broken MOV PTS/DTS ordering. Generate clean timestamps,
          # discard malformed packets, and force a stable CFR MP4 instead of
          # allowing a partially written artifact to count as success.
          ffmpeg -y -loglevel warning \
            -fflags +genpts+discardcorrupt -err_detect ignore_err -i "$RAW_VIDEO" \
            -map 0:v:0 -an \
            -vf "fps=30,scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setpts=N/(30*TB)" \
            -c:v libx264 -crf 19 -preset medium -pix_fmt yuv420p \
            -movflags +faststart -avoid_negative_ts make_zero "$VIDEO"

          test -s "$VIDEO"
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
          awk -v d="$DURATION" 'BEGIN { exit !(d >= 20.0 && d <= 24.5) }'

          # A nominal-duration container is not enough: require enough decoded
          # frames and make sure decoded presentation timestamps reach EOF.
          DECODED_FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$VIDEO")"
          test -n "$DECODED_FRAMES"
          test "$DECODED_FRAMES" -ge 540
          LAST_PTS="$(ffprobe -v error -select_streams v:0 -show_frames -show_entries frame=best_effort_timestamp_time -of csv=p=0 "$VIDEO" | tail -n1)"
          awk -v last="$LAST_PTS" -v d="$DURATION" 'BEGIN { exit !(last >= d - 0.75) }'

          FREEZE_LOG="$RUNNER_TEMP/macos-native-freeze.log"
          ffmpeg -hide_banner -i "$VIDEO" -vf "freezedetect=n=-50dB:d=10" -an -f null - \
            > /dev/null 2>"$FREEZE_LOG" || true
          if grep -q 'freeze_duration:' "$FREEZE_LOG"; then
            cat "$FREEZE_LOG" >&2
            echo 'Native macOS recording failed motion/interaction quality gate.' >&2
            exit 1
          fi

          # freezedetect may only emit freeze_start when a freeze runs through
          # EOF. Treat an unclosed >=10s freeze as a failure as well.
          LAST_FREEZE_START="$(grep 'freeze_start:' "$FREEZE_LOG" | tail -n1 | sed -E 's/.*freeze_start: ([0-9.]+).*/\1/' || true)"
          LAST_FREEZE_END="$(grep 'freeze_end:' "$FREEZE_LOG" | tail -n1 | sed -E 's/.*freeze_end: ([0-9.]+).*/\1/' || true)"
          if [[ -n "$LAST_FREEZE_START" ]]; then
            if [[ -z "$LAST_FREEZE_END" ]] || awk -v s="$LAST_FREEZE_START" -v e="$LAST_FREEZE_END" 'BEGIN { exit !(s > e) }'; then
              awk -v s="$LAST_FREEZE_START" -v d="$DURATION" 'BEGIN { exit !((d - s) >= 10.0) }' && {
                cat "$FREEZE_LOG" >&2
                echo 'Native macOS recording has an unclosed freeze through EOF.' >&2
                exit 1
              }
            fi
          fi

          ffprobe -v error -show_entries stream=width,height,r_frame_rate,nb_frames -show_entries format=duration,size -of default=nw=1 "$VIDEO"
          kill "$APP_PID" || true
          wait "$APP_PID" || true
          trap - EXIT

      - name: Verify native application state
        run: |
          DATA_DIR="$HOME/Library/Application Support/TimeTrace"
          test -s "$DATA_DIR/time.db"
          test -f "$DATA_DIR/app.log"
          grep -q 'TimeTraceApi initialized' "$DATA_DIR/app.log"
          if grep -q 'API init FAILED' "$DATA_DIR/app.log"; then
            cat "$DATA_DIR/app.log" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TimeTrace-macOS-Demo
          path: |
            ${{ runner.temp }}/timetrace-macos-demo.mp4
            ${{ runner.temp }}/timetrace-macos-native.mp4
            ${{ runner.temp }}/timetrace-macos-demo.log
            ${{ runner.temp }}/timetrace-macos-native.log
            ${{ runner.temp }}/screencapture-macos-native.log
            ${{ runner.temp }}/macos-native-freeze.log
            ${{ runner.temp }}/replayd-screen-capture-approvals.txt
            ${{ runner.temp }}/macos-render-capture.json
          if-no-files-found: warn
