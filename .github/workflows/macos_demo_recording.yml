name: macOS Demo Recording

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/ai-recap
    paths:
      - '.github/workflows/macos_demo_recording.yml'
      - 'app/lib/src/app.dart'
      - 'app/lib/src/core/acceptance/**'
      - 'scripts/seed_acceptance_demo.py'

jobs:
  record-macos-demo:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build signed macOS release app
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      - name: Install FFmpeg when missing
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ffmpeg -version | head -n1

      - name: Seed disposable demo data
        run: |
          DEMO_DB="$HOME/Library/Application Support/TimeTrace/time.db"
          python3 scripts/seed_acceptance_demo.py --db "$DEMO_DB"
          test -s "$DEMO_DB"

      - name: Record deterministic Flutter render-tree demo
        run: |
          set -euo pipefail
          APP_PATH="$(find app/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          APP_BIN="$APP_PATH/Contents/MacOS/$EXECUTABLE"

          FRAME_DIR="$RUNNER_TEMP/timetrace-macos-frames"
          VIDEO="$RUNNER_TEMP/timetrace-macos-demo.mp4"
          mkdir -p "$FRAME_DIR"

          TIMETRACE_ACCEPTANCE_CAPTURE_DIR="$FRAME_DIR" \
            "$APP_BIN" >"$RUNNER_TEMP/timetrace-macos-demo.log" 2>&1 &
          APP_PID=$!

          for _ in $(seq 1 80); do
            if [[ -f "$FRAME_DIR/capture.done" ]]; then
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/timetrace-macos-demo.log" >&2
              exit 1
            fi
            sleep 1
          done

          test -f "$FRAME_DIR/capture.done"
          test -f "$FRAME_DIR/capture.json"
          FRAME_COUNT="$(find "$FRAME_DIR" -name 'frame-*.png' | wc -l | tr -d ' ')"
          test "$FRAME_COUNT" -ge 180

          ffmpeg -y -loglevel warning \
            -framerate 10 -i "$FRAME_DIR/frame-%05d.png" \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2" \
            -c:v libx264 -crf 20 -preset medium -pix_fmt yuv420p \
            -movflags +faststart "$VIDEO"

          kill "$APP_PID" || true
          wait "$APP_PID" || true

          test -s "$VIDEO"
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -show_entries format=duration,size -of default=nw=1 "$VIDEO"
          cp "$FRAME_DIR/capture.json" "$RUNNER_TEMP/macos-render-capture.json"

      - name: Record clean native macOS demo
        run: |
          set -euo pipefail
          APP_PATH="$(find app/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          APP_BIN="$APP_PATH/Contents/MacOS/$EXECUTABLE"
          RAW_VIDEO="$RUNNER_TEMP/timetrace-macos-native.mov"
          VIDEO="$RUNNER_TEMP/timetrace-macos-native.mp4"

          "$APP_BIN" >"$RUNNER_TEMP/timetrace-macos-native.log" 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          sleep 7
          osascript -e 'tell application "TimeTrace" to activate'

          click_capture_allow() {
            osascript <<'APPLESCRIPT'
          tell application "System Events"
            repeat with proc in application processes
              try
                repeat with win in windows of proc
                  try
                    if exists button "Allow" of win then
                      click button "Allow" of win
                      return "clicked"
                    end if
                    if exists button "Allow For One Month" of win then
                      click button "Allow For One Month" of win
                      return "clicked"
                    end if
                  end try
                end repeat
              end try
            end repeat
          end tell
          return "not-found"
          APPLESCRIPT
          }

          # Warm up Apple's recorder. macOS Sequoia can show a second prompt
          # asking a CLI process to bypass the private window picker. Explicitly
          # click its Allow button instead of assuming Return activates it.
          WARMUP="$RUNNER_TEMP/macos-screen-permission-warmup.mov"
          /usr/sbin/screencapture -v -V 4 "$WARMUP" \
            >"$RUNNER_TEMP/macos-screen-permission.log" 2>&1 &
          WARMUP_PID=$!

          PERMISSION_CLICKED=false
          for _ in $(seq 1 12); do
            if [[ "$(click_capture_allow 2>/dev/null || true)" == "clicked" ]]; then
              PERMISSION_CLICKED=true
              break
            fi
            sleep 1
          done

          wait "$WARMUP_PID" || true
          test "$PERMISSION_CLICKED" = true
          test -s "$WARMUP"
          rm -f "$WARMUP"
          sleep 2

          # Reject a take if the permission dialog is still present.
          if [[ "$(click_capture_allow 2>/dev/null || true)" == "clicked" ]]; then
            echo 'Screen-capture permission dialog was still present after warm-up.' >&2
            exit 1
          fi

          /usr/sbin/screencapture -v -V 22 -k "$RAW_VIDEO" \
            >"$RUNNER_TEMP/screencapture-macos-native.log" 2>&1 &
          CAPTURE_PID=$!

          sleep 2
          osascript -e 'tell application "System Events" to keystroke "2" using command down'
          sleep 4
          osascript -e 'tell application "System Events" to keystroke "," using command down'
          sleep 4
          osascript -e 'tell application "System Events" to keystroke "1" using command down'
          sleep 4
          osascript -e 'tell application "System Events" to keystroke "2" using command down'

          wait "$CAPTURE_PID"
          test -s "$RAW_VIDEO"

          ffmpeg -y -loglevel warning -i "$RAW_VIDEO" \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2" \
            -c:v libx264 -crf 19 -preset medium -pix_fmt yuv420p \
            -movflags +faststart "$VIDEO"

          test -s "$VIDEO"
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
          awk -v d="$DURATION" 'BEGIN { exit !(d >= 20.0 && d <= 24.5) }'

          # A permissions dialog stealing focus leaves almost the whole take
          # frozen. The walkthrough changes pages every four seconds, so a
          # >=10s freeze means this is not a usable demo even if MP4 decoding
          # succeeds.
          FREEZE_LOG="$RUNNER_TEMP/macos-native-freeze.log"
          ffmpeg -hide_banner -i "$VIDEO" -vf "freezedetect=n=-50dB:d=10" -an -f null - \
            > /dev/null 2>"$FREEZE_LOG" || true
          if grep -q 'freeze_duration:' "$FREEZE_LOG"; then
            cat "$FREEZE_LOG" >&2
            echo 'Native macOS recording failed motion/interaction quality gate.' >&2
            exit 1
          fi

          ffprobe -v error -show_entries stream=width,height,r_frame_rate -show_entries format=duration,size -of default=nw=1 "$VIDEO"
          kill "$APP_PID" || true
          wait "$APP_PID" || true
          trap - EXIT

      - name: Verify native application state
        run: |
          DATA_DIR="$HOME/Library/Application Support/TimeTrace"
          test -s "$DATA_DIR/time.db"
          test -f "$DATA_DIR/app.log"
          grep -q 'TimeTraceApi initialized' "$DATA_DIR/app.log"
          if grep -q 'API init FAILED' "$DATA_DIR/app.log"; then
            cat "$DATA_DIR/app.log" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TimeTrace-macOS-Demo
          path: |
            ${{ runner.temp }}/timetrace-macos-demo.mp4
            ${{ runner.temp }}/timetrace-macos-native.mp4
            ${{ runner.temp }}/timetrace-macos-demo.log
            ${{ runner.temp }}/timetrace-macos-native.log
            ${{ runner.temp }}/macos-screen-permission.log
            ${{ runner.temp }}/screencapture-macos-native.log
            ${{ runner.temp }}/macos-native-freeze.log
            ${{ runner.temp }}/macos-render-capture.json
          if-no-files-found: warn
