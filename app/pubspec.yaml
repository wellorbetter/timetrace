name: timetrace_app
description: "TimeTrace desktop application."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_rust_bridge: ^2.12.0
  fl_chart: ^1.2.0
  lottie: ^3.3.3
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  table_calendar: ^3.2.0
  file_picker: ^11.0.3
  lunar: ^1.7.8
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.1
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon.ico
    - assets/icon_preview.png
    - assets/lottie/empty_state.json
