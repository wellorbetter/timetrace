schema: spec-driven

context: |
  TimeTrace is a local-first desktop activity tracker built with Flutter,
  Riverpod, Rust, SQLite, and flutter_rust_bridge. The supported desktop
  targets are Windows and macOS. UI changes must preserve the existing
  main-branch visual language, remain responsive in resizable windows, and
  keep user data local unless the user explicitly enables an AI provider.

rules:
  proposal:
    - State user-visible removals as explicitly as additions.
    - Preserve local-first and opt-in AI behavior.
  specs:
    - Write testable WHEN/THEN scenarios for date linkage and carousel behavior.
    - Cover empty, loading, disabled-AI, and provider-failure states.
  design:
    - Identify Flutter, Rust bridge, and SQLite migration impact.
    - Prefer the main-branch dashboard structure over introducing new shells.
  tasks:
    - Keep implementation, migration, widget tests, and Windows packaging separate.
