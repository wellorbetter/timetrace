[package]
name = "timetrace-bridge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
timetrace-core = { path = "../crates/core" }
timetrace-plugin-api = { path = "../crates/plugin-api" }
timetrace-plugin-host = { path = "../crates/plugin-host" }
flutter_rust_bridge = "=2.12.0"
anyhow = "1"
chrono = "0.4"
windows-sys = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Threading",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
tracing-appender = "0.2.5"
serde_json = "1"
serde = { workspace = true }
semver = { workspace = true }
thiserror = { workspace = true }
zeroize.workspace = true
getrandom.workspace = true
fs2 = "0.4"
dirs = "6"
futures = "0.3"
rusqlite = { workspace = true, features = ["limits"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "macros"] }
base64 = "0.22"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std"] }

[dev-dependencies]
flutter_rust_bridge_codegen = "2"
tempfile = "3"
sha2.workspace = true
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }
